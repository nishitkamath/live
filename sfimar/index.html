<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; connect-src https://script.google.com https://script.googleusercontent.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Next Hand · Live</title>
<style>
:root{--bg:#f4efe6;--card:#fffdf8;--ink:#1d1d1b;--mute:#6b665c;--line:#e2dccf;--green:#1f5e47;--green2:#e3efe8;--gold:#c98a1b;--gold2:#f7ead0;--red:#b33a2e;--red2:#f6e1dd;--blue:#2d5b8a;--blue2:#e1ebf5;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 48px}
.brand{font:600 12px/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--green);display:flex;align-items:center;gap:8px}
.brand i{width:9px;height:9px;border-radius:2px;background:var(--gold);display:inline-block;transform:rotate(45deg)}
h1{font-size:22px;line-height:1.2;margin:8px 0 2px}
.sub{color:var(--mute);font-size:14px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--green);color:#fff;border-radius:999px;padding:5px 12px;font-weight:600;font-size:14px;margin-top:10px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:16px}
.panel h2{font-size:18px;margin:0 0 4px}
.hint{color:var(--mute);font-size:14px;margin:0 0 12px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px 16px;font-weight:650;background:var(--green);color:#fff;cursor:pointer;text-align:center}
.btn.ghost{background:transparent;color:var(--green);border:1.5px solid var(--green)}
.btn.small{display:inline-block;width:auto;padding:8px 14px;font-size:14px}
.btn:disabled{opacity:.5}
.team{display:flex;justify-content:space-between;align-items:center;width:100%;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;margin:8px 0;cursor:pointer;text-align:left}
.team b{font-weight:650}.team span{color:var(--mute);font-size:13px}
.or{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:13px;margin:14px 0 8px}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
input[type=text],input[type=number],textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:12px;background:#fff;outline:none}
input:focus,textarea:focus{border-color:var(--green)}
textarea{min-height:84px;resize:vertical}
.row{display:flex;gap:10px}.row>*{flex:1}
.hand{display:grid;gap:10px}
.hc{border-radius:12px;padding:12px 14px;border:1.5px solid}
.hc small{display:block;font:600 11px/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.hc.f{background:var(--blue2);border-color:#b9cde3}.hc.f small{color:var(--blue)}
.hc.c{background:var(--gold2);border-color:#ebd3a3}.hc.c small{color:#8a5d0c}
.hc.k{background:var(--red2);border-color:#e7c1ba}.hc.k small{color:var(--red)}
.hc.p{background:var(--green2);border-color:#bdd8c9}.hc.p small{color:var(--green)}
.box{margin:14px 0 0}
.box label{display:flex;align-items:baseline;gap:8px;font-weight:650}
.box label em{font-style:normal;font:600 11px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--green);background:var(--green2);padding:2px 6px;border-radius:5px}
.box p{margin:2px 0 6px;color:var(--mute);font-size:13.5px}
.status{font-size:13px;color:var(--mute);min-height:18px;margin-top:8px}
.status.ok{color:var(--green)}.status.warn{color:#8a5d0c}
.entry{border-top:1px solid var(--line);padding:10px 0 2px;font-size:14px}
.entry b{font-size:12px;color:var(--mute);font-weight:600}
.wait{display:flex;gap:10px;align-items:center;color:var(--mute)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--gold);animation:p 1.4s infinite}@keyframes p{50%{opacity:.25}}
.sheet{position:fixed;inset:0;background:rgba(20,20,18,.45);display:none;align-items:flex-end;justify-content:center;z-index:9}
.sheet.on{display:flex}
.sheet .in{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
.err{background:var(--red2);color:var(--red);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:12px;display:none}
/* ---------- host board ---------- */
body.host{font-size:18px;background:#efe9dd}
.board{display:grid;grid-template-columns:300px 1fr;gap:22px;padding:20px 24px;min-height:100vh}
.side{position:sticky;top:20px;align-self:start}
.qr{background:#fff;border-radius:16px;padding:16px;border:1px solid var(--line)}
.qr svg,.qrc img,.qrc canvas{width:100%!important;height:auto!important;display:block}
.link{font:700 15.5px/1.25 ui-monospace,Menlo,Consolas,monospace;margin:12px 0 0;word-break:break-all}
.nums{display:flex;gap:12px;margin-top:16px}
.num{flex:1;background:#fff;border-radius:12px;padding:10px 12px;border:1px solid var(--line)}
.num b{display:block;font-size:30px;line-height:1}.num span{font-size:13px;color:var(--mute)}
.stages{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.stages button{border:1.5px solid var(--green);background:#fff;color:var(--green);border-radius:999px;padding:8px 14px;font-weight:650;cursor:pointer;font-size:15px}
.stages button.on{background:var(--green);color:#fff}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;min-height:170px}
.tile h3{margin:0;font-size:20px;line-height:1.2}
.tile .m{color:var(--mute);font-size:14px;margin:2px 0 8px}
.mini{font-size:13.5px;line-height:1.35;color:#3c3934}
.mini div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{display:flex;gap:5px;margin-top:10px}
.score span{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:14px;background:#ece6da;color:#aaa294}
.score span.on{background:var(--green);color:#fff}
.empty{color:var(--mute);font-size:16px;padding:30px 0}
.ov{position:fixed;inset:0;background:rgba(20,20,18,.55);display:none;z-index:9;padding:3vh 3vw}
.ov.on{display:block}
.ov .in{background:var(--card);border-radius:18px;height:100%;overflow:auto;padding:26px 30px}
.ov h2{font-size:32px;margin:0}
.ov .grid{display:grid;grid-template-columns:1fr 1.5fr;gap:26px;margin-top:16px}
.ov .hc{font-size:18px}
.fillin{margin:10px 0 12px;padding:10px 12px;border:1.5px dashed var(--green);border-radius:12px;font-weight:600;background:var(--card)}
.addt{display:flex;gap:10px;align-items:flex-start;margin:0 0 14px}
.addt textarea{flex:1;min-height:64px;font:inherit;font-size:15px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.addt button{white-space:nowrap}
.ov .f2{margin:0 0 14px}.ov .f2 b{display:block;font:600 13px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;color:var(--green);text-transform:uppercase}
.ov .f2 div{font-size:21px;line-height:1.35;white-space:pre-wrap}
.close{float:right}
@media (max-width:820px){.board{grid-template-columns:1fr}.side{position:static}.ov .grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<div class="sheet" id="sheet"><div class="in" id="sheetIn"></div></div>
<div class="ov" id="ov"><div class="in" id="ovIn"></div></div>
<script>
var EXEC = "https://script.google.com/macros/s/AKfycbzaIpTuwXEhgD6Y1fvxEP8tJhvtyHaKcY07zGcKBELmz-fpGlUr7x7hpA9WXbAo47tMUQ/exec";
var BOOT = (function(){var q=new URLSearchParams(location.search).get('p');var parts=location.pathname.split('/').filter(Boolean);var p=String(q||parts[parts.length-1]||'').replace(/\.html$/,'').replace(/^\/+|\/+$/g,'').toLowerCase();if(p==='index')p='';var m=p.match(/^([a-z0-9-]+?)-host-([a-z0-9]+)$/);var ev=m?m[1]:p;if(!/^[a-z0-9-]{0,40}$/.test(ev))ev='';return {mode:m?'host':'student',event:ev,key:m?m[2]:'',t:''}})();
var SHORT_LINK = "live.thenexthand.com/sfimar", qrNode = null;
function qrEl(){if(qrNode)return qrNode;qrNode=document.createElement('div');qrNode.className='qrc';if(window.QRCode){new QRCode(qrNode,{text:'https://'+SHORT_LINK,width:512,height:512,correctLevel:QRCode.CorrectLevel.M})}else{qrNode.innerHTML='<div style="padding:30px 0;text-align:center;color:#6b665c">Scan code unavailable. Type the link below.</div>';qrNode._fallback=1}return qrNode}
function loadQR(cb){if(window.QRCode)return cb();var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';s.onload=cb;s.onerror=cb;document.head.appendChild(s)}
var BOXES = [
  {f:'S', name:'Scenario: who and where', step:'Empathise', p:'Who is your customer, where and when? One thing you saw them do.', ex:'e.g. First-years in the hostel at 11 pm, buying chips from the vending machine. They check the price first.'},
  {f:'C', name:'Challenge: the problem', step:'Define', p:'[Customer] needs [need] because [insight]. Insight = the reason behind it you didn\'t expect.', ex:'e.g. Hostel students need a cheap late-night snack that fills them up, because the canteen shuts at 10.'},
  {f:'O', name:'Opportunity: our idea', step:'Ideate', p:'Your idea in one line, plus the company move you are stealing.', ex:'e.g. ₹30 millet packs sold door to door at 10:30 pm. Stealing Google: test with 5 people first.'},
  {f:'R', name:'Resolution: the cheapest test', step:'Prototype', p:'What can you make in 48 hours? Paper, a video, a sample, a stall.', ex:'e.g. 20 hand-packed pouches with a handwritten label.'},
  {f:'E', name:'Expansion: how we\'ll know, and what\'s next', step:'Test', p:'Test with how many people? What counts as success? Your first-sale target before 27 Nov.', ex:'e.g. Offer to 20 students over two nights. Success = 10 sold, 3 ask again. Target: 100 packs.'}
];
var ORDER = ['join','hand','card','after'];
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return store['_'+k]=v===undefined?store['_'+k]:v}}
function devId(){var d=store('nh_dev');if(!d){d='d'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);store('nh_dev',d)}return d}
/* Two ways in: served by Apps Script (google.script.run), or the copy on thenexthand.com, which posts to the same
   server with fetch and no Google cookies, so phones signed in to several Google accounts still work. */
function viaGoogle(){return !!(window.google&&google.script&&google.script.run)}
function post(body){return fetch(EXEC,{method:'POST',credentials:'omit',cache:'no-store',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)}).then(function(r){return r.json()})}
var ticketP=null;
function ticket(){
  if(BOOT.t)return Promise.resolve(BOOT.t);
  if(!ticketP)ticketP=post({op:'boot',event:BOOT.event,device:devId()}).then(function(r){ticketP=null;if(r&&r.ok){BOOT.t=r.t;return r.t}throw new Error((r&&r.err)||'Please reload the page.')},function(e){ticketP=null;throw e});
  return ticketP;
}
function call(req){
  req.event=BOOT.event; req.device=devId(); if(BOOT.key)req.key=BOOT.key;
  if(viaGoogle()){if(BOOT.t)req.t=BOOT.t;return new Promise(function(res,rej){google.script.run.withSuccessHandler(res).withFailureHandler(rej).api(req)})}
  return ticket().then(function(t){req.t=t;return post(req)}).then(function(r){if(r&&!r.ok&&r.reload)BOOT.t='';return r},function(){return {ok:false,err:'No connection. Trying again…'}});
}
var state=null, dirty={}, saving={}, pending={}, timers={};
function stageAt(s){return ORDER.indexOf(state&&state.stage||'join')>=ORDER.indexOf(s)}

/* ================= STUDENT ================= */
function renderStudent(){
  var v=state, a=$('app'), t=v.team;
  var h='<div class="wrap"><div class="brand"><i></i>The Next Hand · Live</div><h1>'+esc(v.title)+'</h1>';
  if(!t){
    h+='<div class="panel"><h2>Which team are you in?</h2><p class="hint">Pick your team. Not listed? One person creates it; everyone else waits a moment and picks it. This phone stays with one team.</p>';
    if(v.teams.length){v.teams.forEach(function(x){h+='<button class="team" data-join="'+esc(x.id)+'" data-name="'+esc(x.name)+'"><b>'+esc(x.name)+'</b><span>'+x.members+' phone'+(x.members==1?'':'s')+'</span></button>'});h+='<div class="or">or</div>'}
    h+='<input type="text" id="newName" maxlength="40" placeholder="New team name" autocomplete="off"><div style="height:10px"></div><button class="btn" id="mk">Create team and join</button><div class="err" id="err"></div></div>';
    a.innerHTML=h+'</div>';
    a.querySelectorAll('[data-join]').forEach(function(b){b.onclick=function(){confirmJoin({teamId:b.dataset.join},b.dataset.name)}});
    $('mk').onclick=function(){var n=$('newName').value.trim();if(n.length<2){showErr('Give your team a name (at least 2 letters).');return}var ex=v.teams.filter(function(x){return x.name.toLowerCase()==n.toLowerCase()})[0];confirmJoin(ex?{teamId:ex.id}:{name:n},ex?ex.name:n)};
    return;
  }
  h+='<div class="chip">● '+esc(t.name)+' · '+t.members+' phone'+(t.members==1?'':'s')+'</div>';
  // hand
  if(!stageAt('hand')&&!t.hand){h+='<div class="panel"><div class="wait"><span class="dot"></span>You\'re in. Watch the screen for the next step.</div></div>'}
  if(stageAt('hand')||t.hand){
    h+='<div class="panel"><h2>Your hand</h2>';
    if(!t.hand){h+='<p class="hint">Four cards: a future, a customer, a constraint and a company practice. One person taps, the whole team sees it.</p><button class="btn" id="deal">Deal our hand</button>'}
    else{
      h+='<p class="hint">5 minutes: re-play your idea with this hand. What do you keep, drop or add?</p><div class="fillin">With this hand, our idea becomes ____ for ____.</div><div class="hand">'+
      '<div class="hc f"><small>The future · '+esc(t.hand.future.k)+'</small>'+esc(t.hand.future.t)+'</div>'+
      '<div class="hc c"><small>Your customer</small>'+esc(t.hand.customer.t)+'</div>'+
      '<div class="hc k"><small>Your constraint</small>'+esc(t.hand.constraint.t)+'</div>'+
      '<div class="hc p"><small>Steal from · '+esc(t.hand.practice.k)+'</small>'+esc(t.hand.practice.t)+'</div></div>';
      if(t.redealsLeft>0&&!stageAt('card'))h+='<div style="margin-top:12px"><button class="btn ghost small" id="redeal">Deal again (1 left)</button></div>';
    }
    h+='</div>';
  }
  // experiment card
  if(stageAt('card')){
    h+='<div class="panel"><h2>Experiment Card</h2><p class="hint">One cheap test to run this week. Anyone in your team can type; it saves as you go.</p>';
    BOXES.forEach(function(b){h+='<div class="box"><label for="f'+b.f+'">'+b.f+' · '+b.name+' <em>'+b.step+'</em></label><p>'+esc(b.p)+'</p><textarea id="f'+b.f+'" data-f="'+b.f+'" placeholder="'+esc(b.ex)+'"></textarea></div>'});
    h+='<div class="status" id="st"></div><p class="hint" style="margin-top:10px">Screenshot the finished card for your InnoHatch diary.</p></div>';
  }
  // weekly log
  if(stageAt('after')||(t.logs&&t.logs.length)){
    h+='<div class="panel"><h2>Proof log · to 27 Nov</h2><p class="hint">Come back to this link each week. Log what you tested, what you learnt and any sales.</p>'+
      '<div class="box"><label>What did you test?</label><textarea id="lT"></textarea></div>'+
      '<div class="box"><label>What did you learn?</label><textarea id="lL"></textarea></div>'+
      '<div class="box"><label>What will you change?</label><textarea id="lC"></textarea></div>'+
      '<div class="box row"><div><label>Units sold so far</label><input type="number" id="lS" min="0" inputmode="numeric"></div><div><label>₹ so far</label><input type="number" id="lR" min="0" inputmode="numeric"></div></div>'+
      '<div style="height:12px"></div><button class="btn" id="addLog">Add to log</button><div class="err" id="err"></div>';
    (t.logs||[]).forEach(function(l){h+='<div class="entry"><b>'+esc(new Date(l.ts).toLocaleDateString('en-IN',{day:'numeric',month:'short'}))+(l.sales||l.salesRs?' · '+l.sales+' sold · ₹'+l.salesRs:'')+'</b><div>'+esc(l.tested)+(l.learnt?' → '+esc(l.learnt):'')+(l.changed?' · next: '+esc(l.changed):'')+'</div></div>'});
    h+='</div>';
  }
  a.innerHTML=h+'</div>';
  if($('deal'))$('deal').onclick=function(){this.disabled=true;this.textContent='Dealing…';act({op:'deal'})};
  if($('redeal'))$('redeal').onclick=function(){this.disabled=true;act({op:'redeal'})};
  if(stageAt('card'))BOXES.forEach(function(b){var el=$('f'+b.f);el.value=t.card[b.f]||'';el.oninput=function(){dirty[b.f]=1;setSt('Typing…','');clearTimeout(timers[b.f]);timers[b.f]=setTimeout(function(){saveField(b.f)},1200)};el.onblur=function(){if(dirty[b.f]){clearTimeout(timers[b.f]);saveField(b.f)}}});
  if($('addLog'))$('addLog').onclick=function(){var b=this;b.disabled=true;act({op:'log',entry:{tested:$('lT').value,learnt:$('lL').value,changed:$('lC').value,sales:$('lS').value,salesRs:$('lR').value}},function(){b.disabled=false})};
}
function setSt(t,c){var s=$('st');if(s){s.textContent=t;s.className='status '+(c||'')}}
function saveField(f){
  var el=$('f'+f);if(!el)return;var val=el.value;dirty[f]=0;saving[f]=val;setSt('Saving…','');
  call({op:'save',field:f,value:val}).then(function(r){
    if(saving[f]===val)delete saving[f];
    if(!r.ok){dirty[f]=1;setSt(r.err||'Not saved, retrying…','warn');if(!r.reload)setTimeout(function(){saveField(f)},4000);return}
    state=r.view;setSt('Saved ✓','ok');
  },function(){dirty[f]=1;setSt('No connection. Will retry…','warn');setTimeout(function(){saveField(f)},5000)});
}
function act(req,done){
  call(req).then(function(r){if(done)done();if(!r.ok){showErr(r.err);return}state=r.view;render()},function(){if(done)done();showErr('No connection. Try again.')});
}
function showErr(m){var e=$('err');if(e){e.textContent=m;e.style.display='block'}else alert(m)}
function confirmJoin(req,name){
  var s=$('sheet');$('sheetIn').innerHTML='<h2 style="margin:0 0 6px">Join '+esc(name)+'?</h2><p class="hint">This phone will stay with this team.</p><button class="btn" id="yes">Join '+esc(name)+'</button><div style="height:8px"></div><button class="btn ghost" id="no">Back</button>';
  s.classList.add('on');$('no').onclick=function(){s.classList.remove('on')};
  $('yes').onclick=function(){this.disabled=true;this.textContent='Joining…';req.op='join';call(req).then(function(r){s.classList.remove('on');if(!r.ok){showErr(r.err);return}state=r.view;render()},function(){s.classList.remove('on');showErr('No connection. Try again.')})};
}
/* merge a fresh server view without disturbing what the person is typing */
function mergeStudent(v){
  var focused=document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.f;
  var changedShape=!state||!state.team!==!v.team||(state.stage!==v.stage)||(state.team&&v.team&&(!state.team.hand!==!v.team.hand||state.team.logs.length!==v.team.logs.length||state.team.redealsLeft!==v.team.redealsLeft||state.team.members!==v.team.members))||(!v.team&&JSON.stringify(state.teams)!==JSON.stringify(v.teams));
  var typingElsewhere=document.activeElement&&/lT|lL|lC|lS|lR|newName/.test(document.activeElement.id||'');
  if(changedShape&&!focused&&!typingElsewhere&&!Object.keys(dirty).some(function(k){return dirty[k]})){state=v;render();return}
  state=v;
  if(v.team&&stageAt('card'))BOXES.forEach(function(b){var el=$('f'+b.f);if(el&&b.f!==focused&&!dirty[b.f]&&saving[b.f]===undefined&&el.value!==(v.team.card[b.f]||''))el.value=v.team.card[b.f]||''});
}

/* ================= HOST ================= */
var openTeam=null, addDraft='';
function renderHost(){
  document.body.className='host';
  var v=state,h='<div class="board"><div class="side"><div class="brand"><i></i>The Next Hand · Live</div><h1 style="font-size:24px">'+esc(v.title)+'</h1>'+
  '<div class="qr" style="margin-top:14px"><div id="qrBox"></div><div class="link">'+esc(SHORT_LINK)+'</div></div>'+
  '<div class="nums"><div class="num"><b>'+v.teams.length+'</b><span>teams</span></div><div class="num"><b>'+v.phones+'</b><span>phones</span></div><div class="num"><b>'+v.filled+'</b><span>boxes filled</span></div></div></div><div>'+
  '<div class="stages">'+[['join','1 · Join'],['hand','2 · Hand'],['card','3 · Experiment Card'],['after','4 · Proof log']].map(function(s){return '<button data-st="'+s[0]+'" class="'+(v.stage==s[0]?'on':'')+'">'+s[1]+'</button>'}).join('')+'<button id="dealall" style="margin-left:auto">Deal all hands</button></div>';
  if(v.stage==='join')h+='<div class="addt"><textarea id="addT" placeholder="Add teams in advance: one name per line (e.g. from the class list)">'+esc(addDraft)+'</textarea><button id="addTb">Add teams</button></div>';
  if(!v.teams.length)h+='<div class="empty">No teams yet. Ask everyone to scan the code.</div>';
  h+='<div class="tiles">';
  v.teams.forEach(function(t){
    h+='<div class="tile" data-t="'+esc(t.id)+'"><h3>'+esc(t.name)+'</h3><div class="m">'+t.members+' phone'+(t.members==1?'':'s')+(t.logs.length?' · '+t.logs.length+' log':'')+'</div>';
    if(t.hand)h+='<div class="mini"><div>🔮 '+esc(t.hand.future.t)+'</div><div>👤 '+esc(t.hand.customer.t)+'</div><div>⛓ '+esc(t.hand.constraint.t)+'</div><div>✋ '+esc(t.hand.practice.k)+'</div></div>';
    else h+='<div class="mini" style="color:var(--mute)">No hand dealt yet</div>';
    h+='<div class="score">'+BOXES.map(function(b){return '<span class="'+((t.card[b.f]||'').trim()?'on':'')+'">'+b.f+'</span>'}).join('')+'</div></div>';
  });
  $('app').innerHTML=h+'</div></div></div>';
  if($('qrBox'))$('qrBox').appendChild(qrEl());
  $('app').querySelectorAll('[data-st]').forEach(function(b){b.onclick=function(){hostAct({op:'stage',stage:b.dataset.st})}});
  $('dealall').onclick=function(){hostAct({op:'dealall'})};
  if($('addT')){$('addT').oninput=function(){addDraft=this.value};$('addTb').onclick=function(){var n=addDraft.split(/\n+/).map(function(x){return x.trim()}).filter(Boolean);if(!n.length)return;addDraft='';hostAct({op:'addteams',names:n})}}
  $('app').querySelectorAll('[data-t]').forEach(function(el){el.onclick=function(){openTeam=el.dataset.t;renderOv()}});
  renderOv();
}
function renderOv(){
  var o=$('ov');if(!openTeam){o.classList.remove('on');return}
  var t=state.teams.filter(function(x){return x.id===openTeam})[0];if(!t){openTeam=null;o.classList.remove('on');return}
  var h='<button class="btn ghost small close" id="cl">Close (Esc)</button><h2>'+esc(t.name)+'</h2><div class="sub">'+t.members+' phones</div><div class="grid"><div class="hand">';
  if(t.hand)h+='<div class="hc f"><small>The future · '+esc(t.hand.future.k)+'</small>'+esc(t.hand.future.t)+'</div><div class="hc c"><small>Customer</small>'+esc(t.hand.customer.t)+'</div><div class="hc k"><small>Constraint</small>'+esc(t.hand.constraint.t)+'</div><div class="hc p"><small>Steal from · '+esc(t.hand.practice.k)+'</small>'+esc(t.hand.practice.t)+'</div>'+'<button class="btn ghost small" id="rd">Re-deal this team</button>';
  else h+='<p class="sub">No hand yet.</p>';
  if(!t.members)h+='<button class="btn ghost small" id="rmT">Remove this team (no phones yet)</button>';
  h+='</div><div>';
  BOXES.forEach(function(b){h+='<div class="f2"><b>'+b.f+' · '+b.name+' · '+b.step+'</b><div>'+(esc(t.card[b.f])||'<span style="color:#aaa294">—</span>')+'</div></div>'});
  (t.logs||[]).forEach(function(l){h+='<div class="entry"><b>'+esc(new Date(l.ts).toLocaleDateString('en-IN',{day:'numeric',month:'short'}))+' · '+l.sales+' sold · ₹'+l.salesRs+'</b><div>'+esc(l.tested)+' → '+esc(l.learnt)+'</div></div>'});
  $('ovIn').innerHTML=h+'</div></div>';o.classList.add('on');
  $('cl').onclick=function(){openTeam=null;renderOv()};
  if($('rd'))$('rd').onclick=function(){hostAct({op:'redeal',teamId:t.id})};
  if($('rmT'))$('rmT').onclick=function(){openTeam=null;renderOv();hostAct({op:'delteam',teamId:t.id})};
}
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&openTeam){openTeam=null;renderOv()}});
function hostAct(req){call(req).then(function(r){if(r.ok){state=r.view;render()}else if(r.err)alert(r.err)},function(){})}

/* ================= LOOP ================= */
function render(){if(BOOT.mode==='host')renderHost();else renderStudent()}
function poll(){
  var req=BOOT.mode==='host'?{op:'board'}:{op:'state'};
  call(req).then(function(r){
    if(!r.ok){if(!state){$('app').innerHTML='<div class="wrap"><div class="brand"><i></i>The Next Hand · Live</div><div class="panel">'+esc(r.err)+'</div></div>'}return}
    if(BOOT.mode==='host'){state=r.view;if(!(document.activeElement&&document.activeElement.id==='addT'))render()}else{if(!state){state=r.view;render()}else mergeStudent(r.view)}
  },function(){}).then(function(){setTimeout(poll,(BOOT.mode==='host'?3000:5000)+Math.random()*1500)});
}
if(!BOOT.event){$('app').innerHTML='<div class="wrap"><div class="brand"><i></i>The Next Hand · Live</div><div class="panel">Open the link your speaker shared.</div></div>'}
else{$('app').innerHTML='<div class="wrap"><div class="brand"><i></i>The Next Hand · Live</div><div class="panel"><div class="wait"><span class="dot"></span>Loading…</div></div></div>';if(BOOT.mode==='host')loadQR(poll);else poll()}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&state&&BOOT.mode!=='host')call({op:'state'}).then(function(r){if(r.ok)mergeStudent(r.view)},function(){})});
</script>
